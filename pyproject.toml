[project]
name = "teloude"
version = "1.0.0"
description = "Windows-first personal backup to your own private Telegram storage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.7",
    "Telethon>=1.40",
    "Pillow>=10.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
build = ["pyinstaller>=6.6"]

[project.scripts]
teloude = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "windows: tests that only run on Windows",
    "ui: tests that need a Qt platform (offscreen is fine)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
# ASYNC230/240: tiny bounded metadata ops (stat/exists/open of a temp file); heavy I/O already runs in threads
ignore = ["B008", "E501", "ASYNC230", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC", "B007", "E402", "F841", "B017"]
"scripts/**" = ["ASYNC", "E402"]
